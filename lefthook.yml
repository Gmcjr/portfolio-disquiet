#   https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{astro,ts,tsx,js,mjs,cjs,json,md,mdx,css,yml,yaml}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{astro,ts,tsx,js,mjs,cjs}'
      run: bunx eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    secrets:
      run: bun scripts/scan-secrets.ts {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    depcruise:
      run: bun run depcruise
    test:
      run: bun run test
