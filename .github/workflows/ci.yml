name: CI

# The only merge gate (recovery plan Step 3). Every step blocks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Astro types
        # Lint and typecheck need the astro:content types in .astro/.
        run: bunx astro sync

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Module boundaries
        run: bun run depcruise

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Secret scan
        # Resend API keys start with re_. Fails on any key-like string in
        # tracked files or in the built site. The pre-commit hook runs the same
        # script on staged files.
        run: bun run scan:secrets

      - name: Size budgets and inline scripts
        run: bun run check:size

      - name: Lighthouse (performance and accessibility)
        run: bunx lhci autorun
